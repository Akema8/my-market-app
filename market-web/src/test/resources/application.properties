spring.r2dbc.url=r2dbc:h2:mem:///testdb
spring.r2dbc.username=sa
spring.r2dbc.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=

spring.main.allow-bean-definition-overriding=true

cache.ttl.products-minutes=5
cache.ttl.balance-seconds=30

payment-service.url=http://localhost:8081

# OAuth2
spring.security.oauth2.client.registration.market-web-client.client-id=test-client
spring.security.oauth2.client.registration.market-web-client.client-secret=test-secret
spring.security.oauth2.client.registration.market-web-client.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.market-web-client.provider=keycloak
spring.security.oauth2.client.provider.keycloak.token-uri=http://localhost:8180/realms/my-market/protocol/openid-connect/token