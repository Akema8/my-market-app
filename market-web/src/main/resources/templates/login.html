<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>Вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="bg-light">
<div class="container p-2" style="max-width: 400px; margin-top: 80px;">
    <h2 class="mb-4 text-center">
        <span class="badge text-bg-success">Витрина магазина</span>
    </h2>

    <div th:if="${hasError}" class="alert alert-danger">Неверный логин или пароль.</div>
    <div th:if="${hasLogout}" class="alert alert-success">Вы вышли из системы.</div>
    <div th:if="${hasRegistered}" class="alert alert-success">Регистрация прошла успешно. Войдите в систему.</div>

    <div class="card">
        <div class="card-body">
            <h5 class="card-title mb-3">Вход</h5>
            <form th:action="@{/login}" method="post">
                <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-3">
                    <label for="username" class="form-label">Логин</label>
                    <input type="text" class="form-control" id="username" name="username" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Пароль</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Войти</button>
            </form>
        </div>
    </div>

    <div class="text-center mt-3">
        <span class="text-muted">Нет аккаунта?</span>
        <a href="/register">Зарегистрироваться</a>
    </div>
</div>
</body>

</html>
