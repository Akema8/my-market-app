spring.application.name=my-market-app

spring.r2dbc.url=${R2DBC_URL}
spring.r2dbc.username=${DB_USERNAME}
spring.r2dbc.password=${DB_PASSWORD}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

cache.ttl.products-minutes=5
cache.ttl.balance-seconds=30

payment-service.url=${PAYMENT_SERVICE_URL:http://localhost:8081}

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.paymentService.sliding-window-size=10
resilience4j.circuitbreaker.instances.paymentService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.paymentService.failure-rate-threshold=50

resilience4j.circuitbreaker.instances.paymentService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.paymentService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.paymentService.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.circuitbreaker.instances.paymentService.ignore-exceptions[0]=org.springframework.web.reactive.function.client.WebClientResponseException

resilience4j.retry.instances.paymentServiceRead.max-attempts=3
resilience4j.retry.instances.paymentServiceRead.wait-duration=300ms
resilience4j.retry.instances.paymentServiceRead.enable-exponential-backoff=true
resilience4j.retry.instances.paymentServiceRead.exponential-backoff-multiplier=2

resilience4j.retry.instances.paymentServiceRead.ignore-exceptions[0]=org.springframework.web.reactive.function.client.WebClientResponseException

# OAuth2 Client Credentials
spring.security.oauth2.client.registration.market-web-client.client-id=market-web-client
spring.security.oauth2.client.registration.market-web-client.client-secret=${OAUTH2_CLIENT_SECRET:market-web-secret}
spring.security.oauth2.client.registration.market-web-client.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.market-web-client.provider=keycloak
spring.security.oauth2.client.registration.market-web-client.scope=profile
spring.security.oauth2.client.registration.market-web-client.clientAuthenticationMethod=client_secret_post

spring.security.oauth2.client.provider.keycloak.token-uri=${KEYCLOAK_URL:http://localhost:8180}/realms/my-market/protocol/openid-connect/token
spring.security.oauth2.client.provider.keycloak.authorization-uri=${KEYCLOAK_URL:http://localhost:8180}/realms/my-market/protocol/openid-connect/auth