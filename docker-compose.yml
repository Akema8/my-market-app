version: '3.8'

services:
  app:
    build: .
    ports:
      - "9090:8080"
    depends_on:
      - db
    environment:
      - SPRING_R2DBC_URL=r2dbc:mysql://db:3306/${MYSQL_DATABASE}
      - SPRING_R2DBC_USERNAME=${DB_USERNAME}
      - SPRING_R2DBC_PASSWORD=${DB_PASSWORD}

  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpsw123321
      MYSQL_DATABASE: my_market
      MYSQL_USER: user
      MYSQL_PASSWORD: user_password
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      --default-authentication-plugin=mysql_native_password

volumes:
  db_data: